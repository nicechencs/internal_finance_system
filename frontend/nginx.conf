map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Log to mounted volume
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 允许最大 10MB 的请求体（银行流水 Excel 导入）。
    # 与后端 backend/FinanceApp.Domain/Constants/AppConstants.cs:51
    # 的 AppConstants.File.MaxFileSize (10 * 1024 * 1024) 对齐。
    # nginx 默认 client_max_body_size 为 1MB，会导致 >1MB 的导入被 413 拒绝。
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Frontend routes
    #
    # 安全响应头（后端 SecurityHeadersMiddleware 只作用于 /api JSON，静态资源/HTML
    # 需要 nginx 在这里补齐）。注意 nginx 的 add_header 继承陷阱：只要某个 location
    # 自己定义了 add_header，就会丢弃从 server 级继承来的全部 add_header，因此这些安全头
    # 必须在每个含 add_header 的 location（这里的 location / 和下方静态资源块）内重复声明。
    # 头清单及取值对齐 backend/FinanceApp.Api/Middleware/SecurityHeadersMiddleware.cs。
    # CSP 针对本 SPA（Vue3 + Element Plus + echarts）实际需要定制：
    #   - script-src 'self'：Vue3 生产构建与 echarts 均不需要 eval/inline 脚本
    #   - style-src 'self' 'unsafe-inline'：Element Plus 组件运行时注入内联样式，必须放开
    #   - img-src 'self' data:：echarts canvas 导出、Element Plus 内联 SVG/Base64 图片
    #   - font-src 'self' data:：允许打包进产物的本地字体及 data: 内联字体
    #   - connect-src 'self'：前端仅通过同源 /api 反向代理访问后端，无外链 API
    #   （index.html 与源码经核查无 Google Fonts 等任何外部资源引用）
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
    }

    # API proxy
    #
    # 不在此 location 声明 add_header：后端 SecurityHeadersMiddleware 已为 /api 响应
    # 写入安全头，若 nginx 再叠加会产生重复头。此 location 无 add_header，也不会误继承
    # 上面 location / 的头（add_header 继承按 location 隔离）。
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        # 移除了错误的 Upgrade/Connection 头声明（本应用无 WebSocket）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Cache static assets
    #
    # 本 location 定义了 add_header Cache-Control，会丢弃继承的安全头，
    # 因此在此重复声明与 location / 相同的安全响应头。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
    }
}
