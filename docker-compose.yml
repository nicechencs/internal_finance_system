services:
  api:
    build:
      context: .
      dockerfile: backend/FinanceApp.Api/Dockerfile
    image: ghcr.io/${GITHUB_REPO_OWNER:-your-github-username}/finance-api:${API_IMAGE_TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LOG_DIR: /app/logs
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=${DB_NAME:-finance};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}"
      Auth__CookieSecurePolicy: ${AUTH_COOKIE_SECURE_POLICY:-SameAsRequest}
      Auth__BootstrapAdmin__Enabled: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      Auth__BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      Auth__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Auth__BootstrapAdmin__FullName: ${BOOTSTRAP_ADMIN_FULL_NAME:-System Administrator}
      Auth__BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost}
    expose:
      - "8080"
    volumes:
      - ./logs/backend:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - finance_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: ghcr.io/${GITHUB_REPO_OWNER:-your-github-username}/finance-web:${WEB_IMAGE_TAG:-latest}
    expose:
      - "80"
    volumes:
      - ./logs/frontend:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finance_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  finance_network:
    driver: bridge
