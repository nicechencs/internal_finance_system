name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "$VERSION" in
            v*) ;;
            *) VERSION="v${VERSION}" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "api_image=${IMAGE_PREFIX}/finance-api:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "web_image=${IMAGE_PREFIX}/finance-web:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure version tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists"
          else
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/FinanceApp.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/finance-api:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/finance-api:latest
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/finance-web:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/finance-web:latest
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          API_IMAGE="${{ steps.meta.outputs.api_image }}"
          WEB_IMAGE="${{ steps.meta.outputs.web_image }}"
          NOTES="$(cat <<EOF
          ## Images

          - API: \`${API_IMAGE}\`
          - Web: \`${WEB_IMAGE}\`
          - Also tagged: \`ghcr.io/${{ github.repository_owner }}/finance-api:latest\`, \`ghcr.io/${{ github.repository_owner }}/finance-web:latest\`

          Pull (private package, sign in first):

          \`\`\`bash
          echo \$GHCR_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
          docker pull ${API_IMAGE}
          docker pull ${WEB_IMAGE}
          \`\`\`
          EOF
          )"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --notes "${NOTES}"
          else
            gh release create "${VERSION}" --title "${VERSION}" --notes "${NOTES}"
          fi
